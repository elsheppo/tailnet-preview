</style></head><body><a class="skip" href="#main">Skip to projects</a><header class="header"><a class="brand lookout-brand" href="/" aria-label="Tailnet Preview home"><span class="lookout-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 15 12 4l9 11M6 12h12M12 4v16M7 20h10"/></svg></span><span>Tailnet Preview<span class="brand-period">.</span></span></a></header><main class="library" id="main"><div class="page-head"><div><h1>Projects</h1><p class="summary" id="summary"></p></div><label class="search"><span class="icon" data-icon="search"></span><span class="sr-only">Search projects and views</span><input id="search" type="search" placeholder="Search projects and views" autocomplete="off"></label></div><div class="filters"><div class="tabs" role="group" aria-label="Filter projects"><button class="tab" data-filter="all" aria-pressed="true">All projects</button><button class="tab" data-filter="available" aria-pressed="false">Available</button><button class="tab" data-filter="pinned" aria-pressed="false">Pinned</button></div><button class="refresh" id="recheck" title="Refresh availability"><span class="icon" data-icon="refresh"></span><span class="refresh-label">Refresh</span></button></div><p class="result" id="result-count" aria-live="polite"></p><div class="project-list"><div class="list-head" aria-hidden="true"><span>Project / saved views</span><span>Instance</span></div><section id="grid" aria-label="Projects"></section></div></main><footer class="library-footer"><div class="footer-inner"><p class="foot" id="checked"></p><div class="footer-credit" id="footer-credit"><span>Built by <strong>Shep Bryan</strong></span><nav class="footer-links" aria-label="Creator links"><a href="https://shepbryan.com" target="_blank" rel="noopener noreferrer">Website</a><a href="https://www.linkedin.com/in/shepbryan" target="_blank" rel="noopener noreferrer">LinkedIn</a><a href="https://github.com/elsheppo" target="_blank" rel="noopener noreferrer">GitHub</a></nav></div></div></footer><div class="toast" id="toast" role="status"></div><script>
const config=__PREVIEW_CONFIG_JSON__;
__SHARED_JS__
const projects=config.projects||[],grid=$('#grid'),pins=localMap('pins'),recent=localMap('recent');const libraryState=localMap('library');let filter=['all','available','pinned'].includes(libraryState.filter)?libraryState.filter:'all';$('#search').value=typeof libraryState.query==='string'?libraryState.query:'';$('#footer-credit').hidden=config.showAuthorCredit===false;
$('#summary').textContent=`${projects.length} projects · ${projects.filter(p=>p.healthy).length} available`;$('#checked').textContent=`Availability checked ${new Date(config.checkedAt||Date.now()).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}`;
function openManagement(project){manageProject(project,{isPinned:!!pins[project.id],onPin:()=>{pins[project.id]=!pins[project.id];if(!saveLocal('pins',pins))toast('Pins could not be saved in this browser');render(project.id)}})}
function card(project){const article=el('article','card');article.dataset.project=project.id;const href=viewHref(project),shot=project.thumbnail;
 const content=el('div','project-content'),cover=el('a','cover');cover.href=href;cover.tabIndex=-1;cover.setAttribute('aria-hidden','true');if(shot){cover.title=`${friendly(shot.view)} · Snapshot ${new Date(shot.capturedAt).toLocaleString()}`;const img=el('img');img.src=shot.dataUrl;img.alt='';img.loading='lazy';cover.append(img)}else{const blank=el('span','placeholder');blank.innerHTML=icon('desktop');cover.append(blank)}
 const details=el('div','project-details'),title=el('h2'),link=el('a','project-title-link');link.href=href;if(pins[project.id]){const marker=el('span','pin-marker');marker.innerHTML=icon('pin');marker.title='Pinned';link.append(marker)}link.append(el('span','',project.name));const arrow=el('span','title-arrow');arrow.innerHTML=icon('arrow');link.append(arrow);title.append(link);details.append(title);
 const views=el('nav','view-links');views.setAttribute('aria-label',`${project.name} saved views`);for(const name of Object.keys(project.views)){if(name===project.primaryView&&Object.keys(project.views).length===1)continue;const a=el('a','',friendly(name));a.href=viewHref(project,name);a.title=project.views[name];views.append(a)}if(views.children.length)details.append(views);content.append(cover,details);
 const runtime=el('div','runtime'),top=el('div','runtime-top'),manage=el('button','icon-btn manage');manage.innerHTML=icon('more');manage.setAttribute('aria-label',`Manage ${project.name}`);manage.setAttribute('aria-haspopup','dialog');manage.title='Instance controls';manage.onclick=()=>openManagement(project);top.append(statusNode(project),manage);runtime.append(top,el('span','runtime-note',project.mode==='supervised'?'Managed app':'External app'));
 if(project.mode==='supervised'&&!project.healthy){const start=el('button','btn start');start.innerHTML=icon('play');start.append(el('span','','Start'));start.setAttribute('aria-label',`Start ${project.name}`);start.onclick=()=>openManagement(project);runtime.append(start)}article.append(content,runtime);return article}
function render(focusId){const query=$('#search').value.trim().toLowerCase();saveLocal('library',{filter,query:$('#search').value});const visible=projects.filter(p=>(filter!=='available'||p.healthy)&&(filter!=='pinned'||pins[p.id])&&`${p.name} ${Object.keys(p.views).join(' ')}`.toLowerCase().includes(query)).sort((a,b)=>Number(!!pins[b.id])-Number(!!pins[a.id])||(Number(recent[b.id])||Date.parse(b.updatedAt)||0)-(Number(recent[a.id])||Date.parse(a.updatedAt)||0));grid.replaceChildren();let group;const hasPins=visible.some(p=>pins[p.id]);for(const project of visible){const next=pins[project.id]?'Pinned':'Other projects';if(group!==next&&filter==='all'&&hasPins){group=next;grid.append(el('h2','section-heading',next))}grid.append(card(project))}$('#result-count').textContent=query?`${visible.length} ${visible.length===1?'project':'projects'} found`:'';$('#result-count').hidden=!query;
 if(!visible.length){const empty=el('div','empty');empty.append(el('h2','',!projects.length?'No projects yet':filter==='pinned'&&!query?'No pinned projects':'No matching projects'),el('p','',!projects.length?'Use the preview CLI or ask your agent to start a preview for your project.':filter==='pinned'&&!query?'Pin a project from its instance controls to keep it at the top.':'Try another search or show all projects.'));if(projects.length){const clear=el('button','btn','Show all projects');clear.onclick=()=>{$('#search').value='';setFilter('all');$('#search').focus()};empty.append(clear)}grid.append(empty)}if(focusId){const target=[...grid.querySelectorAll('.card')].find(c=>c.dataset.project===focusId);(target?.querySelector('.manage')||document.querySelector('[data-filter="pinned"]')).focus()}}
function setFilter(value){filter=value;for(const button of document.querySelectorAll('[data-filter]'))button.setAttribute('aria-pressed',String(button.dataset.filter===filter));render()}
for(const button of document.querySelectorAll('[data-filter]'))button.onclick=()=>setFilter(button.dataset.filter);$('#search').oninput=()=>render();$('#recheck').onclick=()=>location.reload();setFilter(filter);
</script></body></html>
